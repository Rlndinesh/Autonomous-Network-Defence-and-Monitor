{% extends 'base.html' %}

{% block content %}
<h1>Allowed Traffic</h1>
<table>
    <thead>
        <tr>
            <th>Source</th>
            <th>Destination</th>
            <th>Port</th>
        </tr>
    </thead>
    <tbody id="allowed-traffic"></tbody>
</table>
<script>
    function fetchAllowedTraffic() {
        fetch('/api/allowed_traffic')
            .then(response => response.json())
            .then(data => {
                const allowedTrafficContainer = document.getElementById('allowed-traffic');
                allowedTrafficContainer.innerHTML = data.allowed.map(item => 
                    `<tr><td>${item.src}</td><td>${item.dst}</td><td>${item.port}</td></tr>`
                ).join('');
            })
            .catch(error => console.error('Error fetching allowed traffic:', error));
    }

    setInterval(fetchAllowedTraffic, 60000); // Fetch every minute
    fetchAllowedTraffic(); // Initial fetch
</script>
{% endblock %}
