{% extends 'base.html' %}

{% block content %}
<h1>Blocked Traffic</h1>
<table>
    <thead>
        <tr>
            <th>Source</th>
            <th>Destination</th>
            <th>Port</th>
        </tr>
    </thead>
    <tbody id="blocked-traffic"></tbody>
</table>
<script>
    function fetchBlockedTraffic() {
        fetch('/api/blocked_traffic')
            .then(response => response.json())
            .then(data => {
                const blockedTrafficContainer = document.getElementById('blocked-traffic');
                blockedTrafficContainer.innerHTML = data.blocked.map(item => 
                    `<tr><td>${item.src}</td><td>${item.dst}</td><td>${item.port}</td></tr>`
                ).join('');
            })
            .catch(error => console.error('Error fetching blocked traffic:', error));
    }

    setInterval(fetchBlockedTraffic, 60000); // Fetch every minute
    fetchBlockedTraffic(); // Initial fetch
</script>
{% endblock %}
