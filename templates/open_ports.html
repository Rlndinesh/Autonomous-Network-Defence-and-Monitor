{% extends 'base.html' %}

{% block content %}
<h1>Open Ports</h1>
<table>
    <thead>
        <tr>
            <th>Port</th>
        </tr>
    </thead>
    <tbody id="open-ports"></tbody>
</table>
<script>
    function fetchOpenPorts() {
        fetch('/api/open_ports')
            .then(response => response.json())
            .then(data => {
                const openPortsContainer = document.getElementById('open-ports');
                openPortsContainer.innerHTML = data.ports.map(port => 
                    `<tr><td>${port}</td></tr>`
                ).join('');
            })
            .catch(error => console.error('Error fetching open ports:', error));
    }

    setInterval(fetchOpenPorts, 60000); // Fetch every minute
    fetchOpenPorts(); // Initial fetch
</script>
{% endblock %}
